# O container serve o clone do repo inteiro: só o site sai, o resto do repo não.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # .git, .claude, .idea e qualquer outro arquivo oculto.
    location ~ /\. {
        return 404;
    }

    location ~* ^/(CLAUDE\.md|docker-compose\.yml|tests\.traefik\.yml|nginx\.conf)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
