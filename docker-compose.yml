version: '3'

services:
  jos3duardo:
    container_name: jos3duardo
    image: nginx
    ports:
      - "9093:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - servidor-network

networks:
  servidor-network:
    external: true